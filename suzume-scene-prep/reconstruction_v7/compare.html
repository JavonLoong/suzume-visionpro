<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>铃芽庭院 V7 色调对照</title><style>body{margin:0;background:#20282b;color:#eef2f1;font:16px/1.6 system-ui}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}figure{margin:0}img{width:100%;display:block}figcaption{padding:8px;background:#303b40}a{color:#b3e0e7}p{max-width:950px}@media(max-width:600px){main{padding:10px}.grid{gap:4px}figcaption{font-size:12px;padding:4px}}</style><main><h1>V7 · 色调校准</h1><p>左：电影参考　中：V6　右：V7。主要调整建筑材质、水体颜色和曝光；几何沿用 V6。天空云形、局部明暗及水面反射分布仍未准确复刻。</p><div class="grid"><figure><img src="reference.jpg"><figcaption>原图</figcaption></figure><figure><img src="front_v6.png"><figcaption>V6 · 修改前</figcaption></figure><figure><img src="front_v7.png"><figcaption>V7 · 修改后</figcaption></figure></div><p>左侧墙体改为冷蓝灰；右侧降低苍白感、加强黄绿；水体转向青蓝。第一轮整体压暗试色已弃用。本版尚未达到原片精确色彩。</p><p><a href="Suzume_v7.blend">Blender 工程</a> · <a href="Suzume_v7.glb">GLB</a> · <a href="Suzume_V7.zip">工程压缩包</a></p><p>以 Blender 渲染检查颜色；GLB 不含天空，程序材质与水面在其他查看器中可能不同。</p></main></html>
