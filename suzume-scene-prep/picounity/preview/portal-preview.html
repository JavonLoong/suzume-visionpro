<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>铃芽之旅 · 梦幻门（浏览器预览）</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
  #info { position: fixed; left: 16px; top: 16px; color: #eee; background: rgba(0,0,0,.5); padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; pointer-events: none; z-index: 10; }
  #info b { color: #7fd0ff; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">
  <b>铃芽之旅 · 梦幻门</b>（浏览器预览）<br/>
  门洞内 = 梦幻世界（星空/花海/水面）｜门外 = 现实（灰色地面）<br/>
  🖱 鼠标左键拖动旋转 · 滚轮缩放 · 右键平移 —— 旋转时看门后世界的<b>视差</b>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- 渲染器 ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.stencil = true; // 显式开启模板缓冲
document.body.appendChild(renderer.domElement);

// ---- 场景与相机 ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10151f); // 现实：深色背景（真机为 passthrough）

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.3, 3.2);
camera.lookAt(0, 1.1, -1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.05, -0.5);
controls.update();

// ---- 灯光 ----
scene.add(new THREE.AmbientLight(0xffffff, 0.9));

// ---- 现实层：灰色地面（门外） ----
const floorGeo = new THREE.PlaneGeometry(20, 20);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x3a3f47, roughness: 0.9 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);

// ---- 门框（现实，不透明，遮挡门后世界） ----
const doorW = 1.0, doorH = 2.1, doorT = 0.14;
const frameMat = new THREE.MeshStandardMaterial({ color: 0xc9c4bb, roughness: 0.85 });
const frameGroup = new THREE.Group();
function box(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
  m.position.set(x, y, z);
  m.renderOrder = 3;
  frameGroup.add(m);
}
box(doorT, doorH, doorT, -doorW/2 - doorT/2, doorH/2, 0);   // 左柱
box(doorT, doorH, doorT,  doorW/2 + doorT/2, doorH/2, 0);   // 右柱
box(doorW + 2*doorT, doorT, doorT, 0, doorH + doorT/2, 0);  // 上梁
scene.add(frameGroup);

// ---- 门洞遮罩：只写 stencil=1，不显示颜色 ----
const maskMat = new THREE.MeshBasicMaterial({
  colorWrite: false,
  depthWrite: false,
  stencilWrite: true,
  stencilRef: 1,
  stencilFunc: THREE.AlwaysStencilFunc,
  stencilZPass: THREE.ReplaceStencilOp,
  side: THREE.DoubleSide,
});
const mask = new THREE.Mesh(new THREE.PlaneGeometry(doorW, doorH), maskMat);
mask.position.set(0, doorH/2, 0);
mask.renderOrder = 1;
scene.add(mask);

// ---- 门后梦幻世界：只在 stencil==1（门洞内）渲染 ----
function portalize(mat) {
  mat.stencilWrite = true;
  mat.stencilRef = 1;
  mat.stencilFunc = THREE.EqualStencilFunc;
  return mat;
}
const dream = new THREE.Group();
dream.renderOrder = 2;

// 星空
{
  const starGeo = new THREE.BufferGeometry();
  const n = 400;
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i*3]   = (Math.random() - 0.5) * 6;
    pos[i*3+1] = 1.5 + Math.random() * 3.5;
    pos[i*3+2] = -1 - Math.random() * 5;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const starMat = portalize(new THREE.PointsMaterial({ color: 0xffffff, size: 0.02, sizeAttenuation: true }));
  const stars = new THREE.Points(starGeo, starMat);
  stars.renderOrder = 2;
  dream.add(stars);
}

// 花海
{
  const colors = [0xff6ec7, 0x9b59d0, 0x5fd6d6, 0xff9f43];
  const patchGeo = new THREE.PlaneGeometry(0.16, 0.16);
  for (let i = 0; i < 140; i++) {
    const m = new THREE.Mesh(patchGeo, portalize(new THREE.MeshStandardMaterial({
      color: colors[(Math.random()*colors.length)|0], roughness: 0.8
    })));
    m.rotation.x = -Math.PI / 2;
    m.position.set((Math.random()-0.5)*8, 0.05, -1 - Math.random()*4);
    m.renderOrder = 2;
    dream.add(m);
  }
}

// 水面
{
  const waterMat = portalize(new THREE.MeshStandardMaterial({
    color: 0x4aa3b8, roughness: 0.15, transparent: true, opacity: 0.65
  }));
  const water = new THREE.Mesh(new THREE.PlaneGeometry(9, 7), waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, 0.06, -3.2);
  water.renderOrder = 2;
  dream.add(water);
}

scene.add(dream);

// ---- 渲染循环 ----
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
